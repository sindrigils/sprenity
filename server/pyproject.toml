[project]
name = "sprenity-server"
version = "0.1.0"
description = "Sprenity FastAPI backend"
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.21.0",
    "alembic>=1.15.0",
    "asyncpg>=0.30.0",
    "fastapi>=0.128.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.7.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "uvicorn>=0.40.0",
    "websockets>=15.0.1",
]

[project.scripts]
sprenity-server = "app.main:run"
sprenity-e2e-bootstrap = "app.scripts.e2e_bootstrap:main"

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.14.14",
    "ty>=0.0.19",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ty.environment]
root = ["."]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
target-version = "py313"
indent-width = 4
exclude = [".venv", "alembic/versions"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "ASYNC",
    "RUF",
    "B",
    "N",
    "SIM",
    "C4",
    "ISC",
    "LOG",
    "T10",
    "RET",
    "RSE",
    "Q",
    "PYI",
    "PIE",
    "ICN",
    "INT",
    "TC",
    "S",
]

ignore = [
    "E501",
    "UP045",
    "UP007",
    "C401",
    "C405",
    "TC006",
    "S101",
    "S603",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
skip-magic-trailing-comma = false
